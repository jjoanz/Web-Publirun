<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias | Publirun</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="assets/logoPB/Logo 1 Publirun.png">
    <style>
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh; display: grid; place-items: center; padding: 24px;
            background: linear-gradient(135deg, #003057 0%, #004a7f 100%); color: #fff; text-align: center;
        }
        .card { max-width: 520px; }
        img { width: 150px; margin: 0 auto 28px; display: block; filter: brightness(0) invert(1); }
        h1 { font-size: 2.2rem; margin-bottom: 14px; }
        p { opacity: .85; font-size: 1.1rem; line-height: 1.6; margin-bottom: 32px; }
        a {
            display: inline-block; padding: 15px 40px; border-radius: 50px; background: #FF6B35;
            color: #fff; text-decoration: none; font-weight: 600;
        }
        a:hover { background: #ff8c5a; }
    </style>
</head>
<body>
    <div class="card">
        <img src="assets/logoPB/PR-04-05.png" alt="Publirun">
        <h1>¡Gracias por escribirnos!</h1>
        <p>Recibimos tu mensaje. Te responderemos lo antes posible.</p>
        <a href="/">Volver a la página</a>
    </div>
</body>
</html>
